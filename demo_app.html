<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lip-Safe AI | 3D 루비 레드 립스틱 AI 판독기 라이브 테스트</title>
  <meta name="description" content="3D 루비 레드 & 골드 립스틱 1초 AI 판독 및 5600K 스튜디오 조도 보정 라이브 테스트" />

  <!-- Pretendard 및 JetBrains Mono 폰트 연결 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    /* 캡처 이미지와 100% 동일한 좌우 사이드-바이-사이드 레이아웃 */
    body {
      background: #0A0A0C;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      margin: 0;
    }

    .demo-main-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 36px;
      max-width: 1050px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* 좌측 원터치 컨트롤 패널 (유저 캡처 이미지 패널 디자인 100% 재현) */
    .test-guide-banner {
      background: rgba(22, 23, 30, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .test-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
      align-items: center;
    }

    .test-btn-item {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <!-- 메인 레이아웃 감싸기 (좌측 패널 + 우측 핸드폰) -->
  <div class="demo-main-layout">
    
    <!-- 1.0 좌측 원터치 컨트롤 패널 -->
    <div class="test-guide-banner">
      <div style="font-size: 0.95rem; font-weight: 900; color: #FCD34D; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span>🧪</span> Lip-Safe AI 1초 AI 판독 원터치 라이브 시뮬레이터
      </div>
      
      <div style="font-size: 0.8rem; color: #A1A1AA; line-height: 1.5; word-break: keep-all;">
        아래 정중앙의 3D 루비 레드 립스틱을 터치하거나 빠른 데모 버튼을 클릭해 보세요!
      </div>
      
      <div class="test-btn-group">
        <button class="test-btn-item" style="background: rgba(239, 68, 68, 0.2); border-color: #EF4444; color: #FFF;" onclick="triggerTest('danger')">
          🔴 GHB 마약 검출 테스트
        </button>
        <button class="test-btn-item" style="background: rgba(245, 158, 11, 0.15); border-color: #F59E0B; color: #FCD34D;" onclick="triggerTest('warning')">
          🟡 조도 주의 테스트
        </button>
        <button class="test-btn-item" style="background: rgba(16, 185, 129, 0.2); border-color: #10B981; color: #A7F3D0;" onclick="triggerTest('safe')">
          🟢 정상 안심 음용 테스트
        </button>
      </div>
    </div>

    <!-- 2.0 우측 럭셔리 모바일 디바이스 프레임 -->
    <div class="mobile-device-shell" id="mobile-device-shell">
      
      <!-- 상단 스테이터스 바 -->
      <div class="status-bar">
        <span class="status-time">23:14</span>
        <div class="status-notch"><div class="status-notch-camera"></div></div>
        <div class="status-icons"><span>📶</span><span>🛜</span><span style="color: #34C759;">🔋</span></div>
      </div>

      <!-- 메인 뷰포트 -->
      <div class="app-viewport" id="app-viewport">
        
        <!-- 립스틱 스캐너 메인 스테이지 -->
        <div id="scanner-view-wrapper">
          <div class="lipstick-scanner-stage" id="standalone-scanner-stage">
            
            <!-- 상단 퀵 컨트롤러 바 -->
            <div class="stage-top-actions">
              <button class="top-action-btn" id="top-demo-preset-btn" title="⚙️ 데모 설정" onclick="toggleDemoMenu()">⚙️</button>
              <button class="top-action-btn" id="top-light-toggle-btn" title="💡 5600K 조도 보정" onclick="toggleLight()">💡</button>
            </div>

            <!-- 립스틱 원형 아우라 링 -->
            <div class="lipstick-aura-ring"></div>

            <!-- 스캔 프로그레스 링 -->
            <div class="scan-progress-ring" id="progress-ring">
              <span id="progress-text" style="font-family: var(--font-mono); font-size: 1.5rem; font-weight: 900; color: var(--text-gold); text-shadow: 0 0 15px var(--gold-primary);"></span>
            </div>

            <!-- 3D 루비 레드 & 골드 립스틱 오브제 -->
            <div class="lipstick-3d-wrapper" id="lipstick-touch-target" onclick="startScan('random')" title="터치하여 1초 AI 판독 실행">
              <div class="scan-laser-line" id="laser-line"></div>
              <div class="lipstick-bullet-tip" id="lipstick-tip"></div>
              <div class="lipstick-inner-tube"></div>
              <div class="lipstick-gold-body">
                <span class="lipstick-brand-label">LIP-SAFE AI</span>
              </div>
              <div class="lipstick-shadow"></div>
            </div>

            <!-- 안내 가이드 -->
            <div style="margin-top: 14px; font-size: 0.76rem; font-weight: 700; color: var(--text-gold);" id="status-guide">
              💄 3D 립스틱을 터치하면 1초 AI 판독이 작동합니다
            </div>
          </div>

          <!-- 성분 분석 팝업 컨테이너 -->
          <div id="analysis-popup-container"></div>
        </div>

        <!-- 서브 뷰 (스토어 & 기록) -->
        <div id="subview-container"></div>
      </div>

      <!-- 하단 4개 내비게이션 바 -->
      <div class="bottom-nav-bar">
        <button class="nav-item active" id="nav-shutter" onclick="switchTab('shutter')">
          <span class="nav-icon">📷</span><span>립스틱 셔터</span>
        </button>
        <div class="nav-item-sos-center">
          <button class="sos-circle-trigger" onclick="openSOSModal()">
            <span style="font-size: 1.2rem;">🛡️</span><span class="sos-label-text">SOS</span>
          </button>
        </div>
        <button class="nav-item" id="nav-store" onclick="switchTab('store')">
          <span class="nav-icon">🛍️</span><span>스토어</span>
        </button>
        <button class="nav-item" id="nav-history" onclick="switchTab('history')">
          <span class="nav-icon">🕒</span><span>기록</span>
        </button>
      </div>

      <!-- 모달 컨테이너 -->
      <div id="modal-container"></div>
    </div>
  </div>

  <!-- Standalone Interactive Engine Script -->
  <script>
    let isScanning = false;
    let isStudioLightOn = false;
    let scanHistory = [
      { time: '23:10', status: 'danger', drugName: 'GHB (물뽕)', confidence: 99.4, beforeColor: '#FF2A6D', afterColor: '#7B2CBF', delta: 42 },
      { time: '22:45', status: 'safe', drugName: '검출 안 됨 (안전)', confidence: 99.8, beforeColor: '#FF2A6D', afterColor: '#FF2A6D', delta: 0 }
    ];

    // Web Audio API Synth Beep & Chime
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBeep() {
      try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
      } catch(e){}
    }

    function playChime() {
      try {
        const ctx = getAudio(); if (!ctx) return;
        const now = ctx.currentTime; const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(now + 0.4);
      } catch(e){}
    }

    function toggleLight() {
      isStudioLightOn = !isStudioLightOn;
      const shell = document.getElementById('mobile-device-shell');
      const btn = document.getElementById('top-light-toggle-btn');
      if (isStudioLightOn) {
        shell.classList.add('studio-light-active');
        btn.classList.add('active');
      } else {
        shell.classList.remove('studio-light-active');
        btn.classList.remove('active');
      }
    }

    function toggleDemoMenu() {
      const choice = prompt('🧪 데모 시뮬레이션 모드 선택:\n1: 🔴 GHB 마약 위험 감지\n2: 🟡 어두운 조명 주의\n3: 🟢 정상 안전 음료', '1');
      if (choice === '1') startScan('danger');
      else if (choice === '2') startScan('warning');
      else if (choice === '3') startScan('safe');
    }

    function triggerTest(mode) {
      startScan(mode);
    }

    function startScan(mode = 'random') {
      if (isScanning) return;
      isScanning = true;

      document.getElementById('analysis-popup-container').innerHTML = '';
      const ring = document.getElementById('progress-ring');
      const txt = document.getElementById('progress-text');
      const wrapper = document.getElementById('lipstick-touch-target');
      const guide = document.getElementById('status-guide');

      ring.classList.add('active');
      wrapper.classList.add('is-scanning');
      guide.innerText = '⚡ 1초 온디바이스 AI 광학 스펙트럼 판독 중...';

      let prog = 0;
      const timer = setInterval(() => {
        prog += 10;
        txt.innerText = prog + '%';
        if (prog % 30 === 0) playBeep();

        if (prog >= 100) {
          clearInterval(timer);
          isScanning = false;
          ring.classList.remove('active');
          wrapper.classList.remove('is-scanning');
          txt.innerText = '';
          playChime();
          finishScan(mode);
        }
      }, 90);
    }

    function finishScan(mode) {
      let finalMode = mode;
      if (mode === 'random') {
        const r = Math.random();
        if (r < 0.5) finalMode = 'danger';
        else if (r < 0.75) finalMode = 'warning';
        else finalMode = 'safe';
      }

      const tip = document.getElementById('lipstick-tip');
      const popupContainer = document.getElementById('analysis-popup-container');
      const guide = document.getElementById('status-guide');

      if (finalMode === 'danger') {
        tip.classList.add('color-changed');
        guide.innerText = '🔴 위험 (Danger) - GHB 마약 성분 검출!';
        popupContainer.innerHTML = `
          <div class="analysis-popup-container status-danger">
            <div class="popup-header">
              <span class="popup-status-pill">🔴 위험 (Danger)</span>
              <button class="popup-close-btn" onclick="closePopup()">✕</button>
            </div>
            <h4 style="font-size: 0.95rem; color: #FFF;">🔴 위험 (Danger) - 마약 성분 감지</h4>
            <p style="font-size: 0.78rem; color: var(--text-secondary);">
              음료 내 위험 마약성 물질(GHB/물뽕)이 높은 신뢰도로 검출되었습니다. 절대로 음용하지 마시고 비상 SOS를 실행하세요!
            </p>
            <div class="color-comparison-row">
              <div class="color-dot-item"><div class="color-dot" style="background: #FF2A6D;"></div><span>적시기 전</span></div>
              <span class="arrow-icon">➔</span>
              <div class="color-dot-item"><div class="color-dot" style="background: #7B2CBF;"></div><span>적신 후 변색</span></div>
              <div style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-gold);">
                <div>신뢰도: <b>99.4%</b></div><div>변색: <b>+42nm</b></div>
              </div>
            </div>
            <button class="popup-action-btn btn-danger-emergency" onclick="openSOSModal()">
              🚨 비상 SOS 긴급 신고 연동 실행
            </button>
          </div>
        `;

        scanHistory.unshift({ time: new Date().toLocaleTimeString('ko-KR'), status: 'danger', drugName: 'GHB (물뽕)', confidence: 99.4, beforeColor: '#FF2A6D', afterColor: '#7B2CBF', delta: 42 });
      } else if (finalMode === 'warning') {
        tip.classList.remove('color-changed');
        guide.innerText = '🟡 주의 (Warning) - 저조도 조도 보정 필요';
        popupContainer.innerHTML = `
          <div class="analysis-popup-container status-warning">
            <div class="popup-header">
              <span class="popup-status-pill">🟡 주의 (Warning)</span>
              <button class="popup-close-btn" onclick="closePopup()">✕</button>
            </div>
            <h4 style="font-size: 0.95rem; color: #FFF;">🟡 주의 (Warning) - 저조도 환경</h4>
            <p style="font-size: 0.78rem; color: var(--text-secondary);">
              현재 장소가 어두워 광학 수치가 부족합니다. 상단 💡 버튼을 눌러 5600K 스튜디오 조도를 보정 후 재촬영하세요.
            </p>
            <button class="popup-action-btn" style="background: #F59E0B; color: #FFF;" onclick="toggleLight(); closePopup(); startScan('random');">
              🟡 5600K 스튜디오 조도 보정 켜기
            </button>
          </div>
        `;
      } else {
        tip.classList.remove('color-changed');
        guide.innerText = '🟢 정상 (Safe) - 마약 물질 미검출';
        popupContainer.innerHTML = `
          <div class="analysis-popup-container status-safe">
            <div class="popup-header">
              <span class="popup-status-pill">🟢 정상 (Safe)</span>
              <button class="popup-close-btn" onclick="closePopup()">✕</button>
            </div>
            <h4 style="font-size: 0.95rem; color: #FFF;">🟢 정상 (Safe) - 안심 음용 안내</h4>
            <p style="font-size: 0.78rem; color: var(--text-secondary);">
              GHB, 케타민 등 5종 마약 성분이 검출되지 않았습니다. 안심하고 음료를 이용하셔도 좋습니다.
            </p>
            <button class="popup-action-btn" style="background: #10B981; color: #FFF;" onclick="closePopup()">
              🟢 안심 음용 확인 완료
            </button>
          </div>
        `;
        scanHistory.unshift({ time: new Date().toLocaleTimeString('ko-KR'), status: 'safe', drugName: '검출 안 됨 (안전)', confidence: 99.8, beforeColor: '#FF2A6D', afterColor: '#FF2A6D', delta: 0 });
      }
    }

    function closePopup() {
      document.getElementById('analysis-popup-container').innerHTML = '';
      document.getElementById('status-guide').innerText = '💄 3D 립스틱을 터치하면 1초 AI 판독이 작동합니다';
    }

    function openSOSModal() {
      closePopup();
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-full-overlay">
          <div class="modal-card" style="border-color: var(--color-danger); box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.6rem;">🚨</span>
                <h3 style="font-size: 1.15rem; color: var(--color-danger);">112 긴급 비상 SOS 연동</h3>
              </div>
              <button class="popup-close-btn" onclick="closeModal()">✕</button>
            </div>

            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 14px; padding: 12px; margin-bottom: 16px;">
              <div style="font-size: 0.82rem; font-weight: 800; color: var(--color-danger);">📍 GPS 위치 추적 완료</div>
              <div style="font-family: var(--font-mono); font-size: 0.78rem; color: #FFF;">37.5665° N, 126.9780° E (강남구 테헤란로)</div>
            </div>

            <button class="btn btn-lg btn-danger-emergency" style="width: 100%; margin-bottom: 10px;" onclick="alert('🚨 112 경찰청 긴급 통화가 연결됩니다!')">
              📞 112 즉시 경찰 전화 연결
            </button>
            <button class="btn btn-lg btn-outline" style="width: 100%;" onclick="closeModal()">
              닫기
            </button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function switchTab(tab) {
      document.getElementById('nav-shutter').classList.remove('active');
      document.getElementById('nav-store').classList.remove('active');
      document.getElementById('nav-history').classList.remove('active');

      const scannerView = document.getElementById('scanner-view-wrapper');
      const subview = document.getElementById('subview-container');

      if (tab === 'shutter') {
        document.getElementById('nav-shutter').classList.add('active');
        scannerView.style.display = 'block';
        subview.innerHTML = '';
      } else if (tab === 'store') {
        document.getElementById('nav-store').classList.add('active');
        scannerView.style.display = 'none';
        subview.innerHTML = `
          <div class="subview-container">
            <div class="modal-card">
              <h3 style="font-size: 1.15rem; color: var(--text-gold); margin-bottom: 12px;">🔮 교체용 시약 립스틱 스토어</h3>
              <div class="store-item-card">
                <div>
                  <div style="font-weight: 800;">💄 Lip-Safe 시약 리필 팁 (5개입)</div>
                  <div style="font-size: 0.8rem; color: var(--gold-primary);">19,800원</div>
                </div>
                <button class="btn btn-sm btn-primary" onclick="alert('🛍️ 장바구니에 담겼습니다!')">담기</button>
              </div>
              <div class="store-item-card">
                <div>
                  <div style="font-weight: 800;">💡 5600K 셀피 조명 스마트 키링</div>
                  <div style="font-size: 0.8rem; color: var(--gold-primary);">12,500원</div>
                </div>
                <button class="btn btn-sm btn-outline" onclick="alert('🛍️ 장바구니에 담겼습니다!')">담기</button>
              </div>
            </div>
          </div>
        `;
      } else if (tab === 'history') {
        document.getElementById('nav-history').classList.add('active');
        scannerView.style.display = 'none';
        subview.innerHTML = `
          <div class="subview-container">
            <div class="modal-card">
              <h3 style="font-size: 1.15rem; color: var(--text-gold); margin-bottom: 12px;">🕒 1초 AI 스캔 이력 장부</h3>
              ${scanHistory.map(h => `
                <div class="history-log-card" style="--log-color: ${h.status === 'danger' ? 'var(--color-danger)' : 'var(--color-success)'}">
                  <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                    <span>${h.time}</span>
                    <span style="font-weight: 800; color: ${h.status === 'danger' ? 'var(--color-danger)' : 'var(--color-success)'}">
                      ${h.status === 'danger' ? '🔴 위험 감지' : '🟢 정상 안전'}
                    </span>
                  </div>
                  <div style="font-weight: 800;">${h.drugName} (신뢰도 ${h.confidence}%)</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
